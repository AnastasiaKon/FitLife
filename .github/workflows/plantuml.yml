name: Generate PlantUML diagrams

on:
  push:
    branches:
      - main
    paths:
      - "diagrams/**/*.puml"
      - ".github/workflows/plantuml.yml"
  pull_request:
    branches:
      - main
    paths:
      - "diagrams/**/*.puml"
      - ".github/workflows/plantuml.yml"

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download latest PlantUML
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Generate SVG diagrams
        run: |
          mkdir -p docs/generated/diagrams
          find diagrams -name "*.puml" -print0 | while IFS= read -r -d '' file; do
            java -jar plantuml.jar -tsvg -o "$(pwd)/docs/generated/diagrams" "$file"
          done

      - name: Commit generated diagrams
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/generated/diagrams/*.svg
          if git diff --cached --quiet; then
            echo "No generated diagram changes"
          else
            git commit -m "Generate PlantUML diagrams"
            git push
          fi